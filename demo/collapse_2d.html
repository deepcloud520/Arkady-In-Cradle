<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>2D 连续倒塌演示 · 支撑图 + 悬挑极限</title>
<style>
  :root{
    --bg:#0b0d11; --panel:#14171c; --line:#262a31; --text:#e6e8ec;
    --muted:#8b929c; --accent:#e05a4a; --alive:#4ab85a;
    --ground:#3a3f46; --column:#8d8f96; --slab:#b9bcc4; --rubble:#5c5a55;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #182030 0%, var(--bg) 60%);
    color:var(--text); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:14px; padding:22px 16px 40px;
  }
  h1{font-size:17px; font-weight:600; margin:0; letter-spacing:.02em}
  .sub{color:var(--muted); font-size:12px; margin:-8px 0 4px; text-align:center; line-height:1.7}
  .sub b{color:#cfd4dc; font-weight:600}
  canvas{background:#0f1115; border:1px solid var(--line); border-radius:10px; display:block; cursor:crosshair;
         box-shadow:0 18px 60px rgba(0,0,0,.55)}
  .bar{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center}
  button{
    background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:8px 13px; font-size:12.5px; cursor:pointer; transition:.15s;
  }
  button:hover{border-color:#3a414c; background:#1a1f26}
  button.primary{border-color:#5c2f2b; background:#241514; color:#ffb4aa}
  button.primary:hover{background:#2d1917}
  button.on{border-color:#2f5c46; background:#13221a; color:#8fe0ae}
  .stats{display:flex; gap:18px; font-size:12px; color:var(--muted); flex-wrap:wrap; justify-content:center}
  .stats b{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums}
  .legend{display:flex; gap:14px; font-size:11.5px; color:var(--muted); flex-wrap:wrap; justify-content:center}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px; vertical-align:-1px}
  .hint{font-size:11.5px; color:#6f7681; text-align:center; max-width:760px; line-height:1.8}
</style>
</head>
<body>
  <h1>2D 连续倒塌演示 · 支撑图 + 悬挑极限</h1>
  <div class="sub">点画面任意处 = 在那一带起爆 · <b>红</b> = 已失去通往地面的传力路径 · 塌落变成<b>废墟</b>（材料不消失）</div>

  <canvas id="cv" width="900" height="600"></canvas>

  <div class="bar">
    <button class="primary" id="b1">炸中柱柱脚</button>
    <button class="primary" id="b2">炸两根柱（连续倒塌）</button>
    <button id="bHeat">支撑热图：关</button>
    <button id="bReset">重置</button>
  </div>

  <div class="stats">
    <span>悬挑极限 <b id="sCant">4</b> 格</span>
    <span>累计坍落 <b id="sCollapse">0</b> 格</span>
    <span>单位存活 <b id="sUnits">3/3</b></span>
    <span>状态 <b id="sState">稳定</b></span>
  </div>

  <div class="legend">
    <span><i style="background:#b9bcc4"></i>楼板</span>
    <span><i style="background:#8d8f96"></i>柱/墙</span>
    <span><i style="background:#5c5a55"></i>废墟</span>
    <span><i style="background:#3a3f46"></i>地坪（根）</span>
    <span><i style="background:#e05a4a"></i>失稳待塌</span>
    <span><i style="background:#4ab85a"></i>单位</span>
  </div>

  <div class="hint">
    规则：竖向贴合不耗代价（柱/墙堆叠），横向每跨一格耗 1，累计 ≤ 悬挑极限才算「有支撑」。
    地面是根。失稳格同一帧坍落，同列底部生成废墟（堆高封顶 3 格）。单位脚下支撑消失 → 坠落，落差 &gt; 2 格阵亡。
  </div>

<script>
(() => {
  const EMPTY = 0, GROUND = 1, COLUMN = 2, SLAB = 3, RUBBLE = 4;
  const COLORS = {0:'#0f1115', 1:'#3a3f46', 2:'#8d8f96', 3:'#b9bcc4', 4:'#5c5a55'};
  const CRIT = '#e05a4a', ALIVE = '#4ab85a';
  const CANT = 4, RUBBLE_CAP = 3, MAX_PASSES = 40;

  const cv = document.getElementById('cv');
  const g = cv.getContext('2d');
  const CELL = 30;
  const W = 30, H = 20;                     // 世界格（y=0 为地坪）
  cv.width = W * CELL; cv.height = H * CELL;

  let grid, units, collapsed, passCount, busy, showHeat, crit, heatImg;

  function reset() {
    grid = new Int8Array(W * H);
    units = [
      {x: 27.5, y: 1, alive: true, falling: false},
      {x: 13.5, y: 6, alive: true, falling: false},
      {x: 18.5, y: 17, alive: true, falling: false},
    ];
    for (let x = 0; x < W; x++) set(0, x, GROUND);
    const cols = [4, 9, 14, 19, 24], floors = [5, 9, 13, 16];
    for (const x of cols) for (let y = 1; y <= 16; y++) set(x, y, COLUMN);
    for (const y of floors) for (let x = cols[0]; x <= cols[cols.length - 1]; x++) set(x, y, SLAB);
    collapsed = 0; passCount = 0; busy = false; crit = [];
    showHeat = false; heatImg = null;
    document.getElementById('bHeat').textContent = '支撑热图：关';
    document.getElementById('bHeat').classList.remove('on');
    resolveUnits();
    setState('稳定');
    draw();
  }

  const idx = (x, y) => y * W + x;
  const get = (x, y) => (x < 0 || x >= W || y < 0 || y >= H) ? EMPTY : grid[idx(x, y)];
  const set = (x, y, v) => { if (x >= 0 && x < W && y >= 0 && y < H) grid[idx(x, y)] = v; };

  // --- 支撑距离：0-1 BFS（竖向 0 代价，横向 1 代价，≤ CANT） --------------
  function supportDist() {
    const INF = 1e9;
    const dist = new Int32Array(W * H).fill(INF);
    const dq = new Int32Array(W * H * 12);   // 数组模拟双端队列
    let head = W * H * 6, tail = head;
    const addFront = (v) => { dq[--head] = v; };
    const addBack = (v) => { dq[tail++] = v; };
    const q = dq;

    for (let x = 0; x < W; x++) {
      if (get(x, 0) !== EMPTY) { dist[idx(x, 0)] = 0; addBack(idx(x, 0)); }
    }
    while (head < tail) {
      const cur = q[head++];
      const x = cur % W, y = (cur - x) / W;
      const d = dist[cur];
      if (d > CANT) continue;
      for (const ny of [y - 1, y + 1]) {
        if (ny < 0 || ny >= H || get(x, ny) === EMPTY) continue;
        const ni = idx(x, ny);
        if (d < dist[ni]) { dist[ni] = d; addFront(ni); }
      }
      if (d < CANT) {
        for (const nx of [x - 1, x + 1]) {
          if (nx < 0 || nx >= W || get(nx, y) === EMPTY) continue;
          const ni = idx(nx, y);
          if (d + 1 < dist[ni]) { dist[ni] = d + 1; addBack(ni); }
        }
      }
    }
    return dist;
  }

  function unsupported() {
    const d = supportDist(), out = [];
    for (let y = 1; y < H; y++) for (let x = 0; x < W; x++) {
      if (get(x, y) !== EMPTY && d[idx(x, y)] > CANT) out.push([x, y]);
    }
    return out;
  }

  // --- 起爆 ---------------------------------------------------------------
  function blast(cx, cy, r) {
    let n = 0;
    for (let y = 1; y < H; y++) for (let x = 0; x < W; x++) {
      if (get(x, y) === EMPTY) continue;
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx * dx + dy * dy <= r * r) { set(x, y, EMPTY); n++; }
    }
    return n;
  }

  function collapsePass() {
    const cells = unsupported();
    if (!cells.length) return 0;
    const perCol = new Map();
    for (const [x, y] of cells) {
      set(x, y, EMPTY);
      perCol.set(x, (perCol.get(x) || 0) + 1);
    }
    for (const [x, n] of perCol) {
      let top = 1;
      for (let y = H - 1; y >= 0; y--) if (get(x, y) !== EMPTY) { top = y + 1; break; }
      const h = Math.min(RUBBLE_CAP, Math.max(1, Math.round(n * 0.6)));
      for (let k = 0; k < h; k++) if (get(x, top + k) === EMPTY) set(x, top + k, RUBBLE);
    }
    collapsed += cells.length;
    passCount++;
    resolveUnits();
    return cells.length;
  }

  // --- 单位 ---------------------------------------------------------------
  function resolveUnits() {
    for (const u of units) {
      if (!u.alive) continue;
      const gx = Math.max(0, Math.min(W - 1, Math.floor(u.x)));
      const cell = Math.floor(u.y - 1e-6);
      const below = cell < 0 ? GROUND : get(gx, cell);
      if (u.falling) {
        const start = u.y;
        while (u.y > 1) {
          u.y -= 0.4;
          const c = Math.floor(u.y - 1e-6);
          if (c < 0 || get(gx, c) !== EMPTY) { u.y = c + 1; break; }
        }
        if (start - u.y > 2) u.alive = false;
        u.falling = false;
      } else if (below === EMPTY) {
        u.falling = true;
        resolveUnits();
      } else {
        u.y = cell + 1;
      }
    }
  }

  // --- 绘制 ---------------------------------------------------------------
  function draw() {
    g.clearRect(0, 0, cv.width, cv.height);
    g.fillStyle = '#0f1115'; g.fillRect(0, 0, cv.width, cv.height);

    const toPx = (x, y) => [x * CELL, (H - 1 - y) * CELL];

    if (showHeat) {
      heatImg = supportDist();
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        if (get(x, y) === EMPTY) continue;
        const d = Math.min(CANT, Math.max(0, heatImg[idx(x, y)]));
        const t = d / CANT;
        const c = t < 0.34 ? lerp('#2a6fdb', '#4ad2c8', t / 0.34)
              : t < 0.67 ? lerp('#4ad2c8', '#e8d24a', (t - 0.34) / 0.33)
                          : lerp('#e8d24a', '#e05a4a', (t - 0.67) / 0.33);
        const [px, py] = toPx(x, y);
        g.fillStyle = c; g.fillRect(px, py, CELL, CELL);
      }
    } else {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const m = get(x, y);
        if (m === EMPTY) continue;
        const [px, py] = toPx(x, y);
        g.fillStyle = COLORS[m];
        g.fillRect(px, py, CELL, CELL);
        if (m === COLUMN) {           // 柱加一点竖向纹理，跟楼板区分
          g.fillStyle = 'rgba(0,0,0,.10)';
          g.fillRect(px + CELL * 0.42, py, CELL * 0.16, CELL);
        }
      }
    }

    for (const [x, y] of crit) {
      const [px, py] = toPx(x, y);
      g.fillStyle = 'rgba(224,90,74,.88)';
      g.fillRect(px, py, CELL, CELL);
    }

    for (const u of units) {
      const [px, py] = toPx(u.x, u.y);
      g.fillStyle = u.alive ? ALIVE : CRIT;
      g.strokeStyle = '#fff'; g.lineWidth = 1.4;
      const r = CELL * 0.34;
      if (u.alive) {
        g.beginPath();
        g.moveTo(px, py - r); g.lineTo(px + r, py + r * 0.8); g.lineTo(px - r, py + r * 0.8);
        g.closePath(); g.fill(); g.stroke();
      } else {
        g.beginPath();
        g.moveTo(px - r, py - r); g.lineTo(px + r, py + r);
        g.moveTo(px + r, py - r); g.lineTo(px - r, py + r);
        g.stroke();
      }
    }
    updateHUD();
  }

  function lerp(a, b, t) {
    const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
    const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
    const p = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
    return `rgb(${p[0]},${p[1]},${p[2]})`;
  }

  function updateHUD() {
    const alive = units.filter(u => u.alive).length;
    document.getElementById('sCollapse').textContent = collapsed;
    document.getElementById('sUnits').textContent = `${alive}/${units.length}`;
  }

  function setState(s) { document.getElementById('sState').textContent = s; }

  // --- 动画：显示失稳 → 塌落 → 再判 -------------------------------------
  async function runCollapse() {
    if (busy) return;
    busy = true;
    try {
      for (let i = 0; i < MAX_PASSES; i++) {
        const cells = unsupported();
        if (!cells.length) break;
        crit = cells;
        setState(`失稳 ${cells.length} 格…`);
        draw();
        await sleep(520);
        crit = [];
        const n = collapsePass();
        setState(`坍落 ${n} 格`);
        draw();
        await sleep(360);
      }
      setState('稳定');
      draw();
    } finally { busy = false; }
  }

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  // --- 事件 ---------------------------------------------------------------
  document.getElementById('b1').onclick = async () => {
    if (busy) return;
    blast(14.5, 1.5, 1.6);
    await runCollapse();
  };
  document.getElementById('b2').onclick = async () => {
    if (busy) return;
    blast(9.5, 1.5, 1.6);
    blast(19.5, 1.5, 1.6);
    await runCollapse();
  };
  document.getElementById('bHeat').onclick = () => {
    showHeat = !showHeat;
    const b = document.getElementById('bHeat');
    b.textContent = `支撑热图：${showHeat ? '开' : '关'}`;
    b.classList.toggle('on', showHeat);
    draw();
  };
  document.getElementById('bReset').onclick = () => reset();

  cv.addEventListener('pointerdown', async (e) => {
    if (busy) return;
    const rect = cv.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (cv.width / rect.width);
    const py = (e.clientY - rect.top) * (cv.height / rect.height);
    const x = px / CELL, y = H - py / CELL;
    blast(x, y, 1.7);
    await runCollapse();
  });

  reset();
})();
</script>
</body>
</html>
